# Generated by engineering-professor. This workflow is formative feedback.
# Final grading repeats critical checks in an instructor-controlled runner.
name: Week 06 Academic Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Week 06 session and authorization tests
        run: npm test -- --ci --runInBand src/features/session/application/sessionLifecycle.test.ts src/features/session/application/sessionService.test.ts src/features/session/infrastructure/secureSessionStorage.test.ts src/features/incidents/application/authorizeOperation.test.ts src/features/incidents/infrastructure/remoteIncidentRepository.test.ts src/api/cloudClient.test.ts course-tests/public/week-06.test.ts course-tests/smoke.test.tsx
      - name: Public Expo Android build
        run: npm run bundle:release
      - name: AC-01 — reproducibility
        run: make verify-week-06
      - name: AC-02 — public behavior
        run: make public-test-week-06
      - name: AC-03 — frozen evidence
        if: github.ref == 'refs/tags/week-06-final'
        run: make evidence-week-06
      - name: Upload academic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-week-06-sesion-segura
          if-no-files-found: warn
          path: |
            reports/week-06/**
            evidence/week-06/**
